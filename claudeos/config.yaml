# yaml-language-server: $schema=file:///Users/pablobfonseca/code/claudeos/schema/config.schema.json
#
# claudeos configuration. Every key is optional; anything left out falls back to
# the default shown in its comment. An unknown key is a hard error, not a warning:
# the loader runs with KnownFields(true), so a typo stops the TUI from starting.
# Reload without restarting with ctrl+r (layout, defaults and project paths only).

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------

# The Obsidian vault claudeos reads: projects, plans, the Ideas list and the
# per-project Inbox all live under it. (default: ~/obsidian/SecondBrain)
vault: ~/obsidian/SecondBrain

# The queues repo the queue tool owns. Every write, from the TUI or `claudeos queue`,
# is one git transaction there: pull --rebase, commit, push. (default: ~/.local/share/vault-queues)
queues: ~/.local/share/vault-queues

# Where job state, the hook log and the usage snapshot are written. Claude
# sessions find it through CLAUDEOS_STATE_DIR, which claudeos sets on every
# tmux window it launches. (default: ~/.local/state/claudeos)
state: ~/.local/state/claudeos

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------

# Send a macOS desktop notification when a job stops and waits for your input.
# Off here because the Telegram path and the TUI's own jobs pane already cover it.
# (default: false)
notify: false

# Defaults the launch overlay is prefilled with. You can still override any of
# them per launch in the overlay itself.
defaults:
  # Model for new sessions: plan jobs use it to pick the planning command
  # (/fable-plan on fable, /opus-plan on opus). (default: opus)
  model: fable

  # Which CLI a launch runs: claude, gemini or codex. Only a bare session (C)
  # and an implement run on gemini or codex; every other kind runs on claude.
  # Override per project with projects.<Name>.executor. (default: claude)
  # executor: claude

  # Run the session in its own git worktree instead of the project checkout, so
  # parallel jobs on the same repo do not fight over the working tree.
  # (default: true)
  worktree: true

  # Chain a job into the next one on its item: a plan session that exits
  # with a plan stamped launches /implement-plan, and an implement session
  # that exits with a PR stamped launches /code-review on it. (default: false)
  chain: true

  # Prefill for the plan overlay's review: field, for what ! launches with, and
  # for the implement overlay's chain: field. It says how far a chain runs: on,
  # the implement a chained plan starts is chained itself and a /code-review
  # session follows the PR; off, the chain stops at the pull request (the
  # implement overlay opens chain: no whatever `chain` above says) and nothing
  # is /exit-ed. Only a prefill: each launch decides for itself, and V runs a
  # code review on any PR by hand. Set it per project below to spend the review
  # only where it pays. (default: true)
  code_review: false

  # Flags appended to every /code-review: the prefill of V's flags field, and
  # what the chained review and the phone's code_review run with, unattended.
  # --comment here posts findings to the PR with nobody watching; --fix is
  # refused (the review runs in the checkout, not on the PR's branch).
  # (default: "")
  # code_review_flags: high

  # How many implement sessions may be live at once, across projects. Over the
  # cap a pressed launch is refused (the same key again launches anyway), a
  # batch skips the item, a chained implement waits and starts by itself when
  # one exits, and the phone's is refused. (default: 0, unlimited)
  max_implements: 5

  # How many open PRs of yours (the rows the PRs pane shows) may exist before an
  # implement launch is held the same way; released when a PR merges or closes.
  # (default: 0, unlimited)
  # max_review_backlog: 4

# ---------------------------------------------------------------------------
# Projects
# ---------------------------------------------------------------------------
#
# The key is the project name exactly as it appears in the vault under
# projects/. `path` is the git checkout a session is launched in; without it a
# project is browsable but cannot launch anything.
#
# Per project you can also set:
#   model:  override defaults.model for this project's sessions
#   executor: override defaults.executor for this project's sessions
#   pinned: keep the project at the top of the projects pane
#   code_review: override defaults.code_review's prefill, either way
#                e.g. GX100: { path: ~/code/gx100-midi-control, code_review: false }
#   repos:  checkouts by tag for a project spread over several git repos; an
#           item tagged with exactly one key launches there, any other item
#           uses path, and ad-hoc PRs are discovered in every repo listed
#                e.g. Devdeck: { path: ~/code/DevDeck, repos: { server: ~/code/DevDeck/devdeck-server, app: ~/code/DevDeck/dev-deck } }

projects:
  ClaudeOS: { path: ~/code/claudeos, pinned: true }
  LazyActions: { path: ~/code/lazy-actions }
  Tribemap: { path: ~/code/upscope-env/tribemap, pinned: true }
  #   # slack_channel: the private #tribemap-feedback channel the Feedback pull (q306) reads into the Inbox; uncomment once q306 ships
  #   # Tribemap: { path: ~/code/upscope-env/tribemap, pinned: true, slack_channel: C0C4D3FBA2Z }
  GX100: { path: ~/code/gx100-midi-control }
  Devdeck:
    path: ~/code/DevDeck
    repos:
      app: ~/code/DevDeck/dev-deck
      server: ~/code/DevDeck/devdeck-server
      web: ~/code/DevDeck/devdeck-web
      hub: ~/code/DevDeck/devdeck-hub
      infra: ~/code/DevDeck/devdeck-infra
      harness: ~/code/DevDeck/devdeck-harness
  CobrowsingSDK:
    path: ~/code/cobrowsing-mobile
    repos:
      ios: ~/code/cobrowsing-mobile/ios-sdk
      android: ~/code/cobrowsing-mobile/android-sdk
      rn: ~/code/cobrowsing-mobile/react-native-sdk
      flutter: ~/code/cobrowsing-mobile/flutter-sdk
      docs: ~/code/cobrowsing-mobile/upscopedocs
  Dotfiles: { path: ~/.dotfiles }
  DotfilesInstaller:
    {
      path: ~/code/go-workspace/src/github.com/pablobfonseca/dotfiles-installer,
    }

# ---------------------------------------------------------------------------
# Telegram
# ---------------------------------------------------------------------------
#
# The chat id is deliberately not a setting: it comes from the environment
# variable CLAUDEOS_TELEGRAM_CHAT, so this file stays machine-independent and
# safe to version-control. No chat id, no messages, whatever is configured here.
# Messages are also skipped while claudeos itself is focused.

telegram:
  #   # Whether the bridge runs at all. false sends nothing, polls for no replies,
  #   # and stops a missing token file from being a startup error, without you
  #   # having to unset the chat id or empty `events`. `claudeos telegram test`
  #   # still sends either way. Read again at every send, so `false` needs no
  #   # restart; every other telegram key does. (default: true)
  enabled: false
  #
  #   # File holding the bot token, read at send time.
  #   # (default: ~/.config/claudeos/telegram-token)
  #   token_file: ~/.config/claudeos/telegram-token
  #
  #   # Job states that send a message: `waiting` (the session is asking you
  #   # something) and `idle` (it finished its turn).
  #   # A verdict word (finished, asking, blocked, failed) names the idles the Judge classified so; idle means every idle.
  #   # (default: [waiting, idle])
  #   events: [waiting, idle]
  #
  #   # Per-job-kind override of `events`. A kind listed here uses its own list;
  #   # everything else falls back to `events` above. An empty list mutes the kind.
  #   kinds:
  #     plan: [waiting]
  #     implement: [waiting, idle]
  #     groom: []
  #
  #   # Wait this long before sending an `idle` message, so a session that pauses
  #   # for a second and keeps going does not buzz your phone. A Go duration
  #   # string. (default: 0, meaning send immediately)
  idle_delay: 30s

# ---------------------------------------------------------------------------
# Slack (Feedback pull)
# ---------------------------------------------------------------------------
#
# A project's Slack channel read into its Inbox: `claudeos slack pull` and the
# running TUI capture each new top-level human message as one `## Raw` line,
# download its files beside the note, and react ✅ as the claim. Inbound only.
# The channel is per project: `projects.<P>.slack_channel` (the id, C… or G…).
# Every key here needs a restart. One machine polls: set CLAUDEOS_SLACK_NO_PULL
# on the others, `claudeos slack pull` still runs there by hand.

# slack:
#   # Whether the TUI polls at all. `claudeos slack pull` runs either way.
#   # (default: true)
#   enabled: true
#
#   # File holding the bot token (xoxb-…), one line, mode 0600, read at call time.
#   # Scopes: files:read, reactions:write, and groups:history (private channel)
#   # or channels:history (public). Invite the bot to the channel.
#   # (default: ~/.config/claudeos/slack-token)
#   token_file: ~/.config/claudeos/slack-token
#
#   # How often the TUI pulls every configured channel. Refused under 10s.
#   # (default: 60s)
#   every: 60s

# ---------------------------------------------------------------------------
# Judge (TypeSafe)
# ---------------------------------------------------------------------------
#
# The TypeSafe System One client behind `claudeos judge test`, and the
# judgments later items build on it (why a session stopped, which job a
# Telegram reply is for). The key is read from a file at call time and never
# placed in any environment.

# judge:
#   # File holding the TypeSafe API key, one line, mode 0600.
#   # (default: ~/.config/claudeos/typesafe-key)
#   key_file: ~/.config/claudeos/typesafe-key

# ---------------------------------------------------------------------------
# Serve (phone link)
# ---------------------------------------------------------------------------
#
# A WebSocket the running TUI serves to a native phone client (DevDeck), gated
# by a pairing token. Plain ws://, no TLS: bind a Tailscale IP or a trusted LAN
# interface, the address is the mitigation. Both keys need a restart.

# serve:
#   # Address to listen on, as host:port. Empty means nothing listens.
#   # (default: "")
#   listen: 100.64.0.1:4343
#
#   # File holding the pairing token the phone presents, one line, mode 0600.
#   # (default: ~/.config/claudeos/serve-token)
#   token_file: ~/.config/claudeos/serve-token

# ---------------------------------------------------------------------------
# Judge
# ---------------------------------------------------------------------------
#
# The TypeSafe System One client behind `claudeos judge test` and the
# judgments later items build on it. The key is read from a file at call time
# and never placed in any environment.

# judge:
#   # Path to the file holding the TypeSafe API key. It must be mode 0600.
#   # (default: ~/.config/claudeos/typesafe-key)
#   key_file: ~/.config/claudeos/typesafe-key

# ---------------------------------------------------------------------------
# Layout
# ---------------------------------------------------------------------------
#
# Six panes: projects, lanes, detail, jobs, prs, inbox. Each one appears exactly
# once, either in the top row (`columns`) or in the bottom stack (`bottom`).
# `columns` may only hold projects, lanes and detail, and must include lanes.
# `bottom` may only hold detail, jobs, prs and inbox.

# layout:
# How many blank rows go after each queue item and before each lane header
# (except the first), so a header sits on its first item and the lanes pane
# reads less dense. Minimum 0, which is the dense view. (default: 0)
# spacing: 1
#
#   # Width in cells of the projects column. Minimum 8. (default: 18)
#   projects_width: 18
#
#   # Share of the top row given to the detail pane, as a percent. 0 to 80.
#   # (default: 35)
#   detail_percent: 35
#
#   # Share of the window width a docked job pane takes, as a percent.
#   # 10 to 90, read on each dock. (default: 50)
#   dock_percent: 50
#
#   # Lanes to show, in this order. A lane left out has no rows.
#   # (default: [Next, Ready, Needs spec, Blocked, Someday, Shipped])
#   lanes: [Next, Ready, Needs spec, Blocked, Someday, Shipped]
#
#   # Trailers an item row paints after its text.
#   row:
#     size: true   # ~S (default: true)
#     id: true     # ^qN (default: true)
#     tags: false  # #feat #bug (default: false)
#
#   # Height in rows of each pane when it sits in the bottom stack. Minimum 1.
#   rows:
#     detail: 12   # (default: 12)
#     jobs: 5      # (default: 5)
#     prs: 5       # (default: 5)
#     inbox: 5     # (default: 5)
#
#   # Top row, left to right. (default: [projects, lanes, detail])
#   columns: [projects, lanes, detail]
#
#   # Bottom stack, top to bottom. (default: [jobs, prs, inbox])
#   bottom: [jobs, prs, inbox]
layout:
  projects_width: 23
  row:
    tags: true
  rows:
    jobs: 7

# ---------------------------------------------------------------------------
# Colors
# ---------------------------------------------------------------------------
#
# Each entry is either one value used for both backgrounds, or a
# {light: …, dark: …} pair. A value is an ANSI number 0-255 or #rrggbb.
# Defaults below are the {light, dark} pairs from DefaultColors().

colors:
  match: "#FFD602" # search hit highlight (default: {light: 170, dark: 212})

#   title: { light: 26, dark: 39 }           # pane titles and the header
#   dim: { light: 243, dark: 245 }           # secondary text: ids, timestamps, hints
#   failure: { light: 160, dark: 196 }       # failed checks, errors, refusals
#   wip: { light: 130, dark: 220 }           # in_progress items and running jobs
#   key: { light: 28, dark: 82 }             # key names in the footer and help
#   lane_header: { light: 97, dark: 141 }    # lane headings in the queue pane
#   section: { light: 243, dark: 245 }       # section headings in docs and overlays
#   cursor: { light: 254, dark: 236 }        # background of the selected row
#   match_text: { light: 231, dark: 232 }    # text drawn on top of a search hit
#   border: { light: 250, dark: 238 }        # pane borders
#   active_border: { light: 26, dark: 39 }   # border of the focused pane

# ---------------------------------------------------------------------------
# Keys
# ---------------------------------------------------------------------------
#
# Rebind any action, by section then action name. The value is one key or a
# list of keys, and it replaces the default rather than adding to it. Press ?
# in the TUI for the full list, or `claudeos docs` for the handbook.
# A few bindings are fixed and cannot be rebound: esc to clear or go back, and
# the viewer's close keys.
#
# Sections: navigation, queue, jobs, prs, inbox, projects, ideas, viewer, global

# keys:
#   navigation:
#     next_item: [j, down]
#     prev_item: [k, up]
#     search: /
#   queue:
#     plan: p
#     implement: i
#     ship: X
#   jobs:
#     toggle: J
#     attach: enter
#   prs:
#     toggle: P
#     merge: M
#     attach: a
#   inbox:
#     toggle: I
#   ideas:
#     open: A
#   viewer:
#     half_down: [d, pgdown, space]
#   global:
#     palette: ":"
#     reload: ctrl+r
#     usage: T

serve:
  listen: 100.108.205.64:4343

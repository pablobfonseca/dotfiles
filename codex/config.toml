# User-level Codex defaults managed from ~/.dotfiles/codex.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
personality = "pragmatic"

sandbox_mode = "workspace-write"
approval_policy = "on-request"
web_search = "disabled"

project_doc_max_bytes = 65536
tool_output_token_limit = 20000

notify = ["/Users/pablobfonseca/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[agents]
max_threads = 6
max_depth = 1

[projects."/Users/pablobfonseca/code/tribemap"]
trust_level = "trusted"

[projects."/Users/pablobfonseca/.dotfiles"]
trust_level = "trusted"

[projects."/Users/pablobfonseca/code/upscope-env/upscope-cli"]
trust_level = "trusted"

[projects."/Users/pablobfonseca/code/upscope-env/tribemap"]
trust_level = "trusted"

[projects."/Users/pablobfonseca/code/claudeos"]
trust_level = "trusted"

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-5.5" = 4
gpt-6-astra = 3
"gpt-6.1-sol" = 3

[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/pablobfonseca/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
